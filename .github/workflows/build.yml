          cat > app/src/main/java/ru/byd/manual/YandexDisk.kt <<'EOF'
          package ru.byd.manual

          import org.json.JSONObject
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          object YandexDisk {

              const val PUBLIC_URL = "https://disk.yandex.ru/d/lVVoiFECcf6IRg"

              private const val API = "https://cloud-api.yandex.net/v1/disk/public/resources"
              private val KEY = URLEncoder.encode(PUBLIC_URL, "UTF-8")

              data class Remote(val path: String, val size: Long, val md5: String?, val url: String?)

              fun open(urlStr: String): HttpURLConnection {
                  var url = urlStr
                  repeat(6) {
                      val c = URL(url).openConnection() as HttpURLConnection
                      c.instanceFollowRedirects = false
                      c.connectTimeout = 20000
                      c.readTimeout = 30000
                      c.setRequestProperty("User-Agent", "BydManual/1.0")
                      val code = c.responseCode
                      if (code in 300..399) {
                          val loc = c.getHeaderField("Location")
                          c.disconnect()
                          if (loc.isNullOrEmpty()) throw IOException("Redirect without location")
                          url = loc
                      } else {
                          if (code !in 200..299) { c.disconnect(); throw IOException("HTTP $code") }
                          return c
                      }
                  }
                  throw IOException("Too many redirects")
              }

              private fun getJson(url: String): JSONObject {
                  var last: Exception? = null
                  repeat(3) { attempt ->
                      try {
                          open(url).inputStream.use { return JSONObject(it.readBytes().toString(Charsets.UTF_8)) }
                      } catch (e: Exception) {
                          last = e
                          Thread.sleep(800L * (attempt + 1))
                      }
                  }
                  throw last ?: IOException("Network error")
              }

              private fun listDir(path: String): List<JSONObject> {
                  val out = ArrayList<JSONObject>()
                  var offset = 0
                  while (true) {
                      val u = StringBuilder("$API?public_key=$KEY&limit=200&offset=$offset")
                      if (path.isNotEmpty()) u.append("&path=").append(URLEncoder.encode(path, "UTF-8"))
                      val emb = getJson(u.toString()).optJSONObject("_embedded") ?: break
                      val items = emb.optJSONArray("items") ?: break
                      for (i in 0 until items.length()) out.add(items.getJSONObject(i))
                      val total = emb.optInt("total", out.size)
                      offset += items.length()
                      if (items.length() == 0 || offset >= total) break
                      Thread.sleep(100)
                  }
                  return out
              }

              fun listAll(): List<Remote> {
                  val out = ArrayList<Remote>()
                  val queue = ArrayDeque<String>()
                  queue.add("")
                  while (queue.isNotEmpty()) {
                      val dir = queue.removeFirst()
                      for (it in listDir(dir)) {
                          val p = it.getString("path")
                          if (it.getString("type") == "dir") queue.add(p)
                          else out.add(
                              Remote(p, it.optLong("size", 0),
                                  it.optString("md5", null), it.optString("file", null))
                          )
                      }
                  }
                  return out
              }

              fun downloadHref(path: String): String {
                  val u = "$API/download?public_key=$KEY&path=" + URLEncoder.encode(path, "UTF-8")
                  return getJson(u).getString("href")
              }
          }
          EOF
          cat > app/src/main/java/ru/byd/manual/ManualStore.kt <<'EOF'
          package ru.byd.manual

          import android.content.Context
          import org.json.JSONObject
          import java.io.File
          import java.nio.ByteBuffer
          import java.nio.charset.CharacterCodingException
          import java.nio.charset.Charset
          import java.nio.charset.CodingErrorAction

          class ManualStore(context: Context) {

              private val prefs = context.getSharedPreferences("settings", Context.MODE_PRIVATE)
              val root = File(context.filesDir, "manual")
              private val manifestFile = File(context.filesDir, "manifest.json")
              private val rootCanonical by lazy { root.canonicalPath }

              var translateEnabled: Boolean
                  get() = prefs.getBoolean("translate", true)
                  set(v) { prefs.edit().putBoolean("translate", v).apply() }

              private val indexByLower by lazy {
                  root.walkTopDown().filter { it.isFile }.associateBy {
                      it.relativeTo(root).path.replace(File.separatorChar, '/').lowercase()
                  }
              }

              fun isReady(): Boolean = manifestFile.isFile && entryPath() != null

              fun entryPath(): String? {
                  if (File(root, "index.html").isFile) return "index.html"
                  if (!root.isDirectory) return null
                  val html = root.walkTopDown()
                      .filter { it.isFile && it.extension.lowercase() in setOf("html", "htm") }.toList()
                  val entry = html.firstOrNull { it.nameWithoutExtension.equals("index", true) }
                      ?: html.firstOrNull()
                  return entry?.relativeTo(root)?.path?.replace(File.separatorChar, '/')
              }

              fun localFile(relRaw: String): File? {
                  val rel = relRaw.replace('\\', '/').ifEmpty { entryPath() ?: return null }
                  val direct = File(root, rel)
                  if (direct.isFile && direct.canonicalPath.startsWith(rootCanonical + File.separator)) return direct
                  val alt = indexByLower[rel.lowercase()] ?: return null
                  return alt.takeIf { it.isFile && it.canonicalPath.startsWith(rootCanonical + File.separator) }
              }

              fun loadManifest(): JSONObject =
                  if (manifestFile.isFile) try { JSONObject(manifestFile.readText()) } catch (e: Exception) { JSONObject() }
                  else JSONObject()

              fun saveManifest(remote: List<YandexDisk.Remote>) {
                  val o = JSONObject()
                  remote.forEach { o.put(it.path, JSONObject().put("size", it.size).put("md5", it.md5 ?: "")) }
                  manifestFile.writeText(o.toString())
              }

              fun needsDownload(r: YandexDisk.Remote, manifest: JSONObject): Boolean {
                  localFile(r.path.trimStart('/')) ?: return true
                  val m = manifest.optJSONObject(r.path) ?: return true
                  if (m.optLong("size", -1) != r.size) return true
                  return r.md5 != null && m.optString("md5") != r.md5
              }

              fun deleteObsolete(remote: List<YandexDisk.Remote>) {
                  val keep = remote.map { it.path.trimStart('/') }.toHashSet()
                  root.walkBottomUp().forEach { f ->
                      if (f.isFile && f.relativeTo(root).path.replace(File.separatorChar, '/') !in keep) f.delete()
                  }
              }

              companion object {
                  fun mimeFor(name: String): String = when (name.substringAfterLast('.', "").lowercase()) {
                      "html", "htm" -> "text/html"
                      "css" -> "text/css"
                      "js" -> "application/javascript"
                      "json" -> "application/json"
                      "png" -> "image/png"
                      "jpg", "jpeg" -> "image/jpeg"
                      "gif" -> "image/gif"
                      "svg" -> "image/svg+xml"
                      "webp" -> "image/webp"
                      "bmp" -> "image/bmp"
                      "ico" -> "image/x-icon"
                      "ttf" -> "font/ttf"
                      "otf" -> "font/otf"
                      "woff" -> "font/woff"
                      "woff2" -> "font/woff2"
                      "eot" -> "application/vnd.ms-fontobject"
                      "pdf" -> "application/pdf"
                      "txt" -> "text/plain"
                      "xml" -> "text/xml"
                      else -> "application/octet-stream"
                  }

                  fun detectCharset(bytes: ByteArray): String {
                      val head = String(bytes, 0, minOf(bytes.size, 2048), Charsets.ISO_8859_1)
                      val declared = Regex("charset\\s*=\\s*[\"']?([A-Za-z0-9_\\-]+)", RegexOption.IGNORE_CASE)
                          .find(head)?.groupValues?.get(1)
                      if (declared != null) try { Charset.forName(declared); return declared } catch (e: Exception) {}
                      return try {
                          Charsets.UTF_8.newDecoder()
                              .onMalformedInput(CodingErrorAction.REPORT)
                              .onUnmappableCharacter(CodingErrorAction.REPORT)
                              .decode(ByteBuffer.wrap(bytes))
                          "UTF-8"
                      } catch (e: CharacterCodingException) { "windows-1251" }
                  }

                  fun readText(bytes: ByteArray): String = String(bytes, Charset.forName(detectCharset(bytes)))
              }
          }
          EOF
          cat > app/src/main/java/ru/byd/manual/Translator.kt <<'EOF'
          package ru.byd.manual

          import android.content.Context
          import com.google.android.gms.tasks.Tasks
          import com.google.mlkit.nl.translate.TranslateLanguage
          import com.google.mlkit.nl.translate.Translation
          import com.google.mlkit.nl.translate.TranslatorOptions
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicInteger

          object Translator {

              @Volatile var ready = false
              @Volatile var error: String? = null
              @Volatile private var initialized = false

              private lateinit var cacheFile: File
              private val exec = Executors.newSingleThreadExecutor()
              private val cache = ConcurrentHashMap<String, String>()
              private val results = ConcurrentHashMap<String, String>()
              private val ticketSeq = AtomicInteger(0)
              private val dirty = AtomicInteger(0)

              private val enRu by lazy {
                  Translation.getClient(
                      TranslatorOptions.Builder()
                          .setSourceLanguage(TranslateLanguage.ENGLISH)
                          .setTargetLanguage(TranslateLanguage.RUSSIAN).build()
                  )
              }
              private val ruEn by lazy {
                  Translation.getClient(
                      TranslatorOptions.Builder()
                          .setSourceLanguage(TranslateLanguage.RUSSIAN)
                          .setTargetLanguage(TranslateLanguage.ENGLISH).build()
                  )
              }

              private val glossary = mapOf(
                  "removal" to "Снятие",
                  "installation" to "Установка",
                  "disassembly" to "Разборка",
                  "reassembly" to "Сборка",
                  "inspection" to "Проверка",
                  "adjustment" to "Регулировка",
                  "replacement" to "Замена",
                  "components" to "Компоненты",
                  "component location" to "Расположение компонентов",
                  "location diagram" to "Схема расположения",
                  "torque specifications" to "Моменты затяжки",
                  "tightening torque" to "Момент затяжки",
                  "service limit" to "Предел износа",
                  "standard value" to "Номинальное значение",
                  "general information" to "Общая информация",
                  "specifications" to "Технические характеристики",
                  "special tools" to "Специальный инструмент",
                  "service tools" to "Сервисный инструмент",
                  "precautions" to "Меры предосторожности",
                  "warning" to "Внимание!",
                  "caution" to "Осторожно!",
                  "note" to "Примечание",
                  "repair" to "Ремонт",
                  "overhaul" to "Капитальный ремонт",
                  "troubleshooting" to "Поиск неисправностей",
                  "diagnosis" to "Диагностика",
                  "diagnostic trouble codes" to "Коды неисправностей (DTC)",
                  "wiring diagram" to "Электрическая схема",
                  "connector" to "Разъём",
                  "harness" to "Жгут проводов",
                  "ground" to "Масса (заземление)",
                  "power supply" to "Питание",
                  "fuse" to "Предохранитель",
                  "relay" to "Реле",
                  "brake pad" to "Тормозная колодка",
                  "brake disc" to "Тормозной диск",
                  "caliper" to "Суппорт",
                  "airbag" to "Подушка безопасности",
                  "seat belt" to "Ремень безопасности",
                  "suspension" to "Подвеска",
                  "steering" to "Рулевое управление",
                  "wheel alignment" to "Углы установки колёс",
                  "tire pressure" to "Давление в шинах",
                  "coolant" to "Охлаждающая жидкость",
                  "transmission" to "Трансмиссия",
                  "clutch" to "Сцепление",
                  "driveshaft" to "Приводной вал",
                  "engine" to "Двигатель",
                  "exhaust" to "Выхлопная система",
                  "fuel system" to "Топливная система",
                  "a/c" to "Кондиционер",
                  "body electrical" to "Электрооборудование кузова",
                  "combination meter" to "Комбинация приборов",
                  "wiper" to "Стеклоочиститель",
                  "washer" to "Омыватель",
                  "power window" to "Стеклоподъёмник",
                  "sunroof" to "Люк",
                  "high voltage" to "Высокое напряжение",
                  "power battery" to "Тяговая батарея",
                  "battery pack" to "Тяговая батарея",
                  "drive motor" to "Тяговый электромотор",
                  "motor controller" to "Контроллер электромотора (инвертор)",
                  "on-board charger" to "Бортовое зарядное устройство",
                  "charging" to "Зарядка",
                  "reduction gear" to "Редуктор",
                  "parking brake" to "Стояночный тормоз"
              )

              fun init(context: Context) {
                  if (initialized) return
                  initialized = true
                  cacheFile = File(context.applicationContext.filesDir, "tr_cache.json")
                  exec.submit {
                      if (cacheFile.isFile) try {
                          val o = JSONObject(cacheFile.readText())
                          for (k in o.keys()) cache[k] = o.optString(k)
                      } catch (e: Exception) {}
                      downloadModels()
                  }
              }

              fun retry() {
                  error = null
                  exec.submit { downloadModels() }
              }

              private fun downloadModels() {
                  try {
                      Tasks.await(enRu.downloadModelIfNeeded(), 10, TimeUnit.MINUTES)
                      Tasks.await(ruEn.downloadModelIfNeeded(), 10, TimeUnit.MINUTES)
                      ready = true
                      error = null
                  } catch (e: Exception) {
                      error = e.message ?: "download error"
                  }
              }

              fun tr(text: String): String {
                  val key = text.trim()
                  if (key.isEmpty()) return text
                  cache[key]?.let { return it }
                  glossary[key.lowercase()]?.let {
                      cache[key] = it
                      return it
                  }
                  return try {
                      val r = Tasks.await(enRu.translate(key), 20, TimeUnit.SECONDS)
                      if (cache.size < 40000) {
                          cache[key] = r
                          if (dirty.incrementAndGet() >= 80) flush()
                      }
                      r
                  } catch (e: Exception) { key }
              }

              fun ruToEn(text: String): String = try {
                  Tasks.await(ruEn.translate(text), 15, TimeUnit.SECONDS)
              } catch (e: Exception) { "" }

              fun request(payload: String): String {
                  val ticket = "t" + ticketSeq.incrementAndGet()
                  exec.submit {
                      try {
                          val o = JSONObject(payload)
                          val items = o.getJSONArray("items")
                          val out = JSONArray()
                          for (i in 0 until items.length()) {
                              val pair = items.getJSONArray(i)
                              out.put(JSONArray().put(pair.getInt(0)).put(tr(pair.getString(1))))
                          }
                          val res = JSONObject().put("items", out)
                          val title = o.optString("title", "")
                          if (title.isNotBlank()) res.put("title", tr(title))
                          results[ticket] = res.toString()
                      } catch (e: Exception) {
                          results[ticket] = "{\"items\":[]}"
                      }
                  }
                  return ticket
              }

              fun poll(ticket: String): String = results.remove(ticket) ?: ""

              fun flush() {
                  if (dirty.get() == 0) return
                  exec.submit {
                      if (dirty.getAndSet(0) == 0) return@submit
                      try {
                          val tmp = File(cacheFile.parentFile, cacheFile.name + ".tmp")
                          tmp.writeText(JSONObject(cache.toMap()).toString())
                          tmp.renameTo(cacheFile)
                      } catch (e: Exception) {}
                  }
              }
          }
          EOF
          cat > app/src/main/java/ru/byd/manual/SyncActivity.kt <<'EOF'
          package ru.byd.manual

          import android.os.Bundle
          import android.view.View
          import android.widget.Button
          import android.widget.ProgressBar
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.coroutineScope
          import kotlinx.coroutines.currentCoroutineContext
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.ensureActive
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import kotlinx.coroutines.sync.Semaphore
          import kotlinx.coroutines.sync.withPermit
          import java.io.File
          import java.io.FileOutputStream
          import java.util.concurrent.atomic.AtomicInteger
          import java.util.concurrent.atomic.AtomicLong

          class SyncActivity : AppCompatActivity() {

              private lateinit var store: ManualStore
              private lateinit var status: TextView
              private lateinit var detail: TextView
              private lateinit var bar: ProgressBar
              private lateinit var retryBtn: Button
              private var job: Job? = null

              @Volatile private var totalFiles = 0
              @Volatile private var totalBytes = 0L

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_sync)
                  store = ManualStore(this)
                  status = findViewById(R.id.syncStatus)
                  detail = findViewById(R.id.syncDetail)
                  bar = findViewById(R.id.syncBar)
                  retryBtn = findViewById(R.id.syncRetry)
                  retryBtn.setOnClickListener { startSync() }
                  findViewById<Button>(R.id.syncCancel).setOnClickListener {
                      job?.cancel(); setResult(RESULT_CANCELED); finish()
                  }
                  startSync()
              }

              private fun startSync() {
                  job?.cancel()
                  totalFiles = 0; totalBytes = 0
                  retryBtn.visibility = View.GONE
                  bar.visibility = View.VISIBLE
                  bar.isIndeterminate = true
                  status.setText(R.string.sync_listing)
                  detail.text = ""

                  val doneFiles = AtomicInteger(0)
                  val doneBytes = AtomicLong(0)

                  job = lifecycleScope.launch {
                      val ticker = launch {
                          while (true) {
                              if (totalFiles > 0) {
                                  bar.isIndeterminate = false
                                  bar.max = totalFiles
                                  bar.progress = doneFiles.get()
                                  detail.text = getString(
                                      R.string.sync_progress,
                                      doneFiles.get(), totalFiles,
                                      doneBytes.get() / 1048576.0, totalBytes / 1048576.0
                                  )
                              }
                              delay(250)
                          }
                      }
                      try {
                          withContext(Dispatchers.IO) { doSync(doneFiles, doneBytes) }
                          setResult(RESULT_OK)
                          finish()
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          status.setText(R.string.sync_error_title)
                          detail.text = getString(R.string.sync_error_body, e.message ?: "")
                          retryBtn.visibility = View.VISIBLE
                          bar.visibility = View.GONE
                      } finally {
                          ticker.cancel()
                      }
                  }
              }

              private suspend fun doSync(doneFiles: AtomicInteger, doneBytes: AtomicLong) {
                  val remote = YandexDisk.listAll()
                  if (remote.none { it.path.equals("/index.html", true) })
                      throw IllegalStateException("index.html not found in the folder")

                  val manifest = store.loadManifest()
                  val todo = remote.filter { store.needsDownload(it, manifest) }
                  totalFiles = todo.size
                  totalBytes = todo.sumOf { it.size }
                  store.root.mkdirs()
                  runOnUiThread { status.setText(R.string.sync_downloading) }

                  val sem = Semaphore(6)
                  val failed = ArrayList<String>()
                  coroutineScope {
                      todo.forEach { r ->
                          launch {
                              sem.withPermit {
                                  try {
                                      download(r)
                                      doneFiles.incrementAndGet()
                                      doneBytes.addAndGet(r.size)
                                  } catch (e: CancellationException) {
                                      throw e
                                  } catch (e: Exception) {
                                      synchronized(failed) { failed.add(r.path) }
                                  }
                              }
                          }
                      }
                  }
                  if (failed.isNotEmpty())
                      throw IllegalStateException("Failed files: ${failed.size} (e.g. ${failed.first()})")

                  store.deleteObsolete(remote)
                  store.saveManifest(remote)
              }

              private suspend fun download(r: YandexDisk.Remote) {
                  val rel = r.path.trimStart('/')
                  val dst = File(store.root, rel)
                  dst.parentFile?.mkdirs()
                  val tmp = File(dst.parentFile, dst.name + ".part")
                  var lastErr: Exception? = null
                  for (attempt in 0 until 3) {
                      currentCoroutineContext().ensureActive()
                      try {
                          val u = if (attempt == 0 && r.url != null) r.url else YandexDisk.downloadHref(r.path)
                          YandexDisk.open(u).inputStream.use { input ->
                              FileOutputStream(tmp).use { out ->
                                  val buf = ByteArray(64 * 1024)
                                  while (true) {
                                      currentCoroutineContext().ensureActive()
                                      val n = input.read(buf)
                                      if (n < 0) break
                                      out.write(buf, 0, n)
                                  }
                              }
                          }
                          if (dst.exists()) dst.delete()
                          if (!tmp.renameTo(dst)) throw IllegalStateException("Cannot save $rel")
                          return
                      } catch (e: CancellationException) {
                          tmp.delete(); throw e
                      } catch (e: Exception) {
                          lastErr = e
                          delay(600L * (attempt + 1))
                      }
                  }
                  tmp.delete()
                  throw lastErr ?: IllegalStateException("Download error $rel")
              }
          }
