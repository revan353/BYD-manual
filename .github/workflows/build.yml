          package ru.byd.manual

          import android.annotation.SuppressLint
          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.view.Menu
          import android.view.MenuItem
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.widget.Toolbar
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import java.io.ByteArrayInputStream
          import java.io.FileInputStream
          import java.nio.charset.Charset

          class MainActivity : AppCompatActivity() {

              private lateinit var store: ManualStore
              private lateinit var web: WebView
              private lateinit var emptyState: LinearLayout
              private lateinit var pageBar: ProgressBar
              private lateinit var trBanner: TextView
              private val prefs by lazy { getSharedPreferences("settings", MODE_PRIVATE) }

              companion object {
                  private const val HOST = "manual.local"
                  private val BOOT_JS = """
          (function () {
            if (window.__trBoot) return; window.__trBoot = true;
            if (!window.AndroidTr) return;
            var SKIP = { SCRIPT: 1, STYLE: 1, NOSCRIPT: 1, CODE: 1, PRE: 1, TEXTAREA: 1, INPUT: 1, SELECT: 1 };
            var done = new WeakSet();
            var busy = false;
            var badge = null;
            var titleDone = false;
            function bad(s) {
              var t = s.trim();
              if (t.length < 2) return true;
              if (!/[A-Za-z]/.test(t)) return true;
              if (/^[A-Z0-9 .,\-\/_:+()]*$/.test(t)) return true;
              var letters = (t.match(/[A-Za-z]/g) || []).length;
              if (letters * 3 < t.replace(/\s+/g, '').length) return true;
              return false;
            }
            function collect() {
              var arr = [];
              var root = document.body || document.documentElement;
              if (!root) return arr;
              var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
              var n;
              while ((n = w.nextNode())) {
                if (done.has(n)) continue;
                var p = n.parentNode;
                if (!p || SKIP[p.nodeName]) { done.add(n); continue; }
                if (bad(n.nodeValue)) { done.add(n); continue; }
                arr.push(n);
                if (arr.length >= 40) break;
              }
              return arr;
            }
            function showBadge(on) {
              if (on) {
                if (!badge) {
                  badge = document.createElement('div');
                  badge.textContent = 'Перевожу…';
                  badge.style.cssText = 'position:fixed;right:8px;bottom:8px;background:#1565C0;color:#fff;padding:4px 12px;border-radius:14px;font:12px sans-serif;z-index:2147483647;opacity:0.9;pointer-events:none;';
                  (document.body || document.documentElement).appendChild(badge);
                }
              } else if (badge) { badge.remove(); badge = null; }
            }
            function run() {
              if (busy) return;
              if (!window.AndroidTr || !AndroidTr.isReady()) return;
              var nodes = collect();
              var wantTitle = !titleDone && /[A-Za-z]/.test(document.title || '');
              if (nodes.length === 0 && !wantTitle) { showBadge(false); return; }
              busy = true; showBadge(true);
              var items = [];
              for (var i = 0; i < nodes.length; i++) items.push([i, nodes[i].nodeValue.trim()]);
              var payload = JSON.stringify({ items: items, title: wantTitle ? document.title : '' });
              var ticket;
              try { ticket = AndroidTr.request(payload); } catch (e) { busy = false; showBadge(false); return; }
              var iv = setInterval(function () {
                var res = '';
                try { res = AndroidTr.poll(ticket); } catch (e) {}
                if (!res) return;
                clearInterval(iv);
                try {
                  var data = JSON.parse(res);
                  var map = {};
                  for (var j = 0; j < data.items.length; j++) map[data.items[j][0]] = data.items[j][1];
                  for (var k = 0; k < nodes.length; k++) {
                    var n = nodes[k];
                    done.add(n);
                    var ru = map[k];
                    if (ru && ru !== n.nodeValue.trim()) {
                      var m = n.nodeValue.match(/^(\s*)([\s\S]*?)(\s*)$/);
                      n.nodeValue = m[1] + ru + m[3];
                    }
                  }
                  if (data.title) { document.title = data.title; }
                  titleDone = true;
                } catch (e) {}
                busy = false;
                setTimeout(run, 30);
              }, 200);
            }
            function schedule() { setTimeout(run, 250); }
            function start() {
              var iv = setInterval(function () {
                if (window.AndroidTr && AndroidTr.isReady()) { clearInterval(iv); run(); }
              }, 700);
              try {
                new MutationObserver(function () { if (!busy) schedule(); })
                  .observe(document.documentElement, { childList: true, subtree: true, characterData: true });
              } catch (e) {}
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
            else start();
          })();
          """.trimIndent()
              }

              private inner class TrBridge {
                  @JavascriptInterface fun isReady(): Boolean = Translator.ready
                  @JavascriptInterface fun request(payload: String): String = Translator.request(payload)
                  @JavascriptInterface fun poll(ticket: String): String = Translator.poll(ticket)
              }

              private val syncLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) {
                      if (store.isReady()) {
                          emptyState.visibility = View.GONE
                          web.visibility = View.VISIBLE
                          if (web.url.isNullOrEmpty()) loadEntry() else web.reload()
                      } else {
                          web.visibility = View.GONE
                          emptyState.visibility = View.VISIBLE
                      }
                  }

              private val searchLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                      val path = res.data?.getStringExtra("path")
                      if (res.resultCode == RESULT_OK && path != null) loadPage(path)
                  }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  store = ManualStore(this)
                  Translator.init(this)

                  val toolbar = findViewById<Toolbar>(R.id.toolbar)
                  setSupportActionBar(toolbar)

                  pageBar = findViewById(R.id.pageBar)
                  emptyState = findViewById(R.id.emptyState)
                  trBanner = findViewById(R.id.trBanner)
                  trBanner.setOnClickListener { Translator.retry() }
                  findViewById<Button>(R.id.btnDownload).setOnClickListener {
                      syncLauncher.launch(Intent(this, SyncActivity::class.java))
                  }

                  web = findViewById(R.id.web)
                  web.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      builtInZoomControls = true
                      displayZoomControls = false
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      allowFileAccess = false
                      allowContentAccess = false
                      cacheMode = WebSettings.LOAD_NO_CACHE
                      textZoom = prefs.getInt("textZoom", 100)
                  }
                  web.addJavascriptInterface(TrBridge(), "AndroidTr")
                  web.webViewClient = object : WebViewClient() {

                      override fun shouldInterceptRequest(
                          view: WebView, request: WebResourceRequest
                      ): WebResourceResponse? {
                          val url = request.url
                          if (!url.host.equals(HOST, true)) return null
                          val rel = Uri.decode(url.encodedPath ?: "/").trimStart('/')
                          val f = store.localFile(rel) ?: return notFound()
                          return try {
                              val mime = ManualStore.mimeFor(f.name)
                              if (mime == "text/html") {
                                  val bytes = f.readBytes()
                                  val cs = ManualStore.detectCharset(bytes)
                                  var html = String(bytes, Charset.forName(cs))
                                  if (store.translateEnabled) html += "\n<script>" + BOOT_JS + "</script>"
                                  WebResourceResponse(mime, cs,
                                      ByteArrayInputStream(html.toByteArray(Charset.forName(cs))))
                              } else {
                                  WebResourceResponse(mime, null, FileInputStream(f))
                              }
                          } catch (e: Exception) { notFound() }
                      }

                      override fun shouldOverrideUrlLoading(
                          view: WebView, request: WebResourceRequest
                      ): Boolean {
                          val url = request.url
                          if (url.host.equals(HOST, true)) return false
                          return when (url.scheme?.lowercase()) {
                              "http", "https", "mailto", "tel" -> {
                                  try { startActivity(Intent(Intent.ACTION_VIEW, url)) }
                                  catch (e: ActivityNotFoundException) { toast(getString(R.string.no_app)) }
                                  true
                              }
                              else -> false
                          }
                      }
                  }
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView, newProgress: Int) {
                          pageBar.visibility = if (newProgress >= 100) View.GONE else View.VISIBLE
                          pageBar.progress = newProgress
                      }
                      override fun onReceivedTitle(view: WebView, title: String?) {
                          if (!title.isNullOrBlank()) supportActionBar?.subtitle = title
                      }
                  }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (web.canGoBack()) web.goBack() else finish()
                      }
                  })

                  applyKeepScreenOn()
                  watchTranslator()

                  if (store.isReady()) {
                      emptyState.visibility = View.GONE
                      loadEntry()
                  } else {
                      web.visibility = View.GONE
                      emptyState.visibility = View.VISIBLE
                      syncLauncher.launch(Intent(this, SyncActivity::class.java))
                  }
              }

              private fun watchTranslator() {
                  lifecycleScope.launch {
                      var wasDownloading = false
                      while (true) {
                          if (!store.translateEnabled) {
                              trBanner.visibility = View.GONE
                              wasDownloading = false
                          } else if (Translator.ready) {
                              if (wasDownloading) {
                                  trBanner.setText(R.string.tr_ready)
                                  trBanner.visibility = View.VISIBLE
                                  delay(1500)
                                  wasDownloading = false
                              }
                              trBanner.visibility = View.GONE
                          } else if (Translator.error != null) {
                              trBanner.visibility = View.VISIBLE
                              trBanner.setText(R.string.tr_error)
                              wasDownloading = true
                          } else {
                              trBanner.visibility = View.VISIBLE
                              trBanner.setText(R.string.tr_downloading)
                              wasDownloading = true
                          }
                          delay(600)
                      }
                  }
              }

              private fun notFound() = WebResourceResponse(
                  "text/plain", "utf-8", 404, "Not Found", emptyMap(),
                  ByteArrayInputStream("404".toByteArray())
              )

              private fun loadEntry() {
                  val e = store.entryPath()
                  if (e == null) {
                      emptyState.visibility = View.VISIBLE; web.visibility = View.GONE; return
                  }
                  loadPage(e)
              }

              private fun loadPage(rel: String) {
                  emptyState.visibility = View.GONE
                  web.visibility = View.VISIBLE
                  web.loadUrl("https://$HOST/" + Uri.encode(rel, "/"))
              }

              override fun onCreateOptionsMenu(menu: Menu): Boolean {
                  menuInflater.inflate(R.menu.main, menu)
                  menu.findItem(R.id.action_keep_screen).isChecked = prefs.getBoolean("keepOn", false)
                  menu.findItem(R.id.action_translate).isChecked = store.translateEnabled
                  return true
              }

              override fun onOptionsItemSelected(item: MenuItem): Boolean {
                  when (item.itemId) {
                      R.id.action_home -> loadEntry()
                      R.id.action_search -> searchLauncher.launch(Intent(this, SearchActivity::class.java))
                      R.id.action_translate -> {
                          val v = !item.isChecked
                          item.isChecked = v
                          store.translateEnabled = v
                          if (v && !Translator.ready) Translator.retry()
                          web.reload()
                      }
                      R.id.action_update -> syncLauncher.launch(Intent(this, SyncActivity::class.java))
                      R.id.action_text_plus -> changeZoom(+10)
                      R.id.action_text_minus -> changeZoom(-10)
                      R.id.action_keep_screen -> {
                          val v = !item.isChecked
                          item.isChecked = v
                          prefs.edit().putBoolean("keepOn", v).apply()
                          applyKeepScreenOn()
                      }
                      else -> return super.onOptionsItemSelected(item)
                  }
                  return true
              }

              private fun changeZoom(delta: Int) {
                  val z = (prefs.getInt("textZoom", 100) + delta).coerceIn(50, 250)
                  web.settings.textZoom = z
                  prefs.edit().putInt("textZoom", z).apply()
                  toast(getString(R.string.text_size, z))
              }

              private fun applyKeepScreenOn() {
                  if (prefs.getBoolean("keepOn", false))
                      window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  else
                      window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              }

              private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()

              override fun onPause() {
                  super.onPause()
                  Translator.flush()
              }

              override fun onDestroy() {
                  if (::web.isInitialized) {
                      (web.parent as? ViewGroup)?.removeView(web)
                      web.destroy()
                  }
                  super.onDestroy()
              }
          }
