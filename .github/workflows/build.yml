          package ru.byd.manual

          import android.os.Bundle
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ListView
          import android.widget.ProgressBar
          import android.widget.SimpleAdapter
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File

          class SearchActivity : AppCompatActivity() {

              private lateinit var store: ManualStore
              private lateinit var query: EditText
              private lateinit var progress: ProgressBar
              private lateinit var info: TextView
              private lateinit var list: ListView
              private var job: Job? = null

              private data class Hit(val title: String, val snippet: String, val path: String)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_search)
                  store = ManualStore(this)
                  Translator.init(this)
                  query = findViewById(R.id.searchQuery)
                  progress = findViewById(R.id.searchProgress)
                  info = findViewById(R.id.searchInfo)
                  list = findViewById(R.id.searchList)

                  findViewById<Button>(R.id.searchGo).setOnClickListener { search() }
                  query.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_SEARCH) { search(); true } else false
                  }
                  list.setOnItemClickListener { _, _, pos, _ ->
                      val item = list.adapter?.getItem(pos) as? Map<*, *>
                      val path = item?.get("path") as? String ?: return@setOnItemClickListener
                      setResult(RESULT_OK, intent.putExtra("path", path))
                      finish()
                  }
              }

              private fun search() {
                  val q = query.text.toString().trim()
                  if (q.length < 2) {
                      Toast.makeText(this, R.string.search_min, Toast.LENGTH_SHORT).show(); return
                  }
                  job?.cancel()
                  progress.visibility = View.VISIBLE
                  info.setText(R.string.searching)
                  list.adapter = null
                  job = lifecycleScope.launch {
                      val (results, en) = withContext(Dispatchers.IO) { doSearch(q) }
                      progress.visibility = View.GONE
                      val sb = StringBuilder()
                      sb.append(if (results.isEmpty()) getString(R.string.search_none)
                                else getString(R.string.search_found, results.size))
                      if (en.isNotBlank()) sb.append("\n").append(getString(R.string.search_translated, en))
                      info.text = sb.toString()
                      val data = results.map {
                          hashMapOf("title" to it.title, "snippet" to it.snippet, "path" to it.path)
                      }
                      list.adapter = SimpleAdapter(
                          this@SearchActivity, data, android.R.layout.simple_list_item_2,
                          arrayOf("title", "snippet"), intArrayOf(android.R.id.text1, android.R.id.text2)
                      )
                  }
              }

              private fun doSearch(q: String): Pair<List<Hit>, String> {
                  val terms = mutableListOf(q)
                  var en = ""
                  val hasCyr = q.any { it in 'а'..'я' || it in 'А'..'Я' || it == 'ё' || it == 'Ё' }
                  if (Translator.ready && hasCyr) {
                      en = Translator.ruToEn(q)
                      if (en.isNotBlank() && !en.equals(q, true)) terms.add(en)
                  }
                  val needles = terms.map { it.lowercase() }
                  val out = ArrayList<Hit>()
                  val files = store.root.walkTopDown()
                      .filter { it.isFile && it.extension.lowercase() in setOf("html", "htm") }.toList()
                  val reTitle = Regex("<title[^>]*>(.*?)</title>",
                      setOf(RegexOption.IGNORE_CASE, RegexOption.DOT_MATCHES_ALL))
                  val reScript = Regex("<script[^>]*>.*?</script>",
                      setOf(RegexOption.IGNORE_CASE, RegexOption.DOT_MATCHES_ALL))
                  val reStyle = Regex("<style[^>]*>.*?</style>",
                      setOf(RegexOption.IGNORE_CASE, RegexOption.DOT_MATCHES_ALL))
                  val reTag = Regex("<[^>]+>")
                  val reWs = Regex("\\s+")

                  for (f in files) {
                      if (out.size >= 300) break
                      val html = try { ManualStore.readText(f.readBytes()) } catch (e: Exception) { continue }
                      val title = reTitle.find(html)?.groupValues?.get(1)?.trim()?.ifBlank { null } ?: f.name
                      val plain = html
                          .replace(reScript, " ").replace(reStyle, " ")
                          .replace(reTag, " ")
                          .replace("&nbsp;", " ").replace("&amp;", "&")
                          .replace("&lt;", "<").replace("&gt;", ">").replace("&quot;", "\"")
                          .replace(reWs, " ").trim()
                      val low = plain.lowercase()
                      var perFile = 0
                      for (needle in needles) {
                          var idx = 0
                          while (perFile < 3 && out.size < 300) {
                              val i = low.indexOf(needle, idx)
                              if (i < 0) break
                              val s = maxOf(0, i - 60)
                              val e = minOf(plain.length, i + needle.length + 90)
                              val snip = (if (s > 0) "…" else "") + plain.substring(s, e) +
                                         (if (e < plain.length) "…" else "")
                              out.add(Hit(title, snip,
                                  f.relativeTo(store.root).path.replace(File.separatorChar, '/')))
                              perFile++
                              idx = i + needle.length
                          }
                      }
                  }
                  val shown = if (Translator.ready)
                      out.map { Hit(Translator.tr(it.title), Translator.tr(it.snippet), it.path) }
                  else out
                  return shown to en
              }
          }
